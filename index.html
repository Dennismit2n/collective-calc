<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Collective-Calc · Wer schuldet wem was?</title>
    <meta
      name="description"
      content="Gruppenausgaben teilen: ohne Konto, ohne App, ohne eigenen Server. Collective-Calc rechnet aus, wer wem wie viel schuldet, und teilt das Ergebnis als Link."
    />
    <link rel="canonical" href="https://dennismit2n.github.io/collective-calc/" />

    <!--
      Vorschaukarte.

      Bei diesem Werkzeug ist das kein Beiwerk: Die Verbreitung läuft
      ausschließlich über geteilte Links, und die Karte im Gruppenchat ist das
      Erste, was fünf andere Leute davon sehen. Ohne sie zeigt WhatsApp nur eine
      nackte Adresse mit einem langen Anker dahinter.

      Der Anker selbst taucht in der Vorschau übrigens nie auf — Vorschau-Roboter
      bekommen ihn gar nicht erst zu sehen, weil der Browser ihn nicht mitsendet.
      Die geteilte Abrechnung bleibt also privat.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Collective-Calc" />
    <meta property="og:title" content="Collective-Calc · Wer schuldet wem was?" />
    <meta
      property="og:description"
      content="Gruppenausgaben teilen: ohne Konto, ohne App, ohne eigenen Server. Die anderen öffnen einfach einen Link."
    />
    <meta property="og:url" content="https://dennismit2n.github.io/collective-calc/" />
    <meta property="og:image" content="https://dennismit2n.github.io/collective-calc/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Collective-Calc. Wer schuldet wem was? Ohne Konto, ohne App, ohne eigenen Server." />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0D1226" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Vor dem ersten Malen anwenden, damit es beim Laden nicht kurz aufblitzt.
      // Seit 31.10.2026 zuerst die gemeinsame Darstellung aller Werkzeuge der Werkstatt
      // (werkstatt.darstellung, roher Text), sonst das Thema aus den Einstellungen.
      // data-vision trägt Hoher Kontrast, Farbenblind und Umkehr; dieselbe Auflösung
      // steht in App.tsx (applyTheme).
      try {
        var r = document.documentElement, m = window.matchMedia, t = null, vi = null;
        var v = localStorage.getItem('werkstatt.darstellung');
        if (!v) v = JSON.parse(localStorage.getItem('cc.v1.settings') || '{}').theme;
        if (v === 'light' || v === 'dark') t = v;
        else if (v === 'hc-dark' || v === 'hc-light') { t = v.slice(3); vi = 'contrast'; }
        else if (v === 'cvd-dark' || v === 'cvd-light') { t = v.slice(4); vi = 'cvd'; }
        else if (v === 'invert') vi = 'invert';
        else if (typeof v === 'string' && /dark/.test(v)) t = 'dark';
        else if (typeof v === 'string' && /light/.test(v)) t = 'light';
        else if (m && m('(prefers-contrast: more)').matches) { t = m('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; vi = 'contrast'; }
        if (t) r.setAttribute('data-theme', t);
        if (vi) r.setAttribute('data-vision', vi);
      } catch (e) {}
      // Knopf „Installieren“: Chrome, Edge und Samsung Internet melden die
      // Installierbarkeit mit beforeinstallprompt, manchmal bevor die App läuft.
      // Das Ereignis bleibt hier liegen, bis die Kopfzeile es abholt (App.tsx).
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredInstall = e;
        if (window.onInstallReady) window.onInstallReady();
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
