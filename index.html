<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Collective-Calc · Wer schuldet wem was?</title>
    <meta
      name="description"
      content="Gruppenausgaben teilen — ohne Konto, ohne App, ohne eigenen Server. Collective-Calc rechnet aus, wer wem wie viel schuldet, und teilt das Ergebnis als Link."
    />
    <link rel="canonical" href="https://dennismit2n.github.io/collective-calc/" />

    <!--
      Vorschaukarte.

      Bei diesem Werkzeug ist das kein Beiwerk: Die Verbreitung läuft
      ausschließlich über geteilte Links, und die Karte im Gruppenchat ist das
      Erste, was fünf andere Leute davon sehen. Ohne sie zeigt WhatsApp nur eine
      nackte Adresse mit einem langen Anker dahinter.

      Der Anker selbst taucht in der Vorschau übrigens nie auf — Vorschau-Roboter
      bekommen ihn gar nicht erst zu sehen, weil der Browser ihn nicht mitsendet.
      Die geteilte Abrechnung bleibt also privat.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Collective-Calc" />
    <meta property="og:title" content="Collective-Calc — Wer schuldet wem was?" />
    <meta
      property="og:description"
      content="Gruppenausgaben teilen: ohne Konto, ohne App, ohne eigenen Server. Die anderen öffnen einfach einen Link."
    />
    <meta property="og:url" content="https://dennismit2n.github.io/collective-calc/" />
    <meta property="og:image" content="https://dennismit2n.github.io/collective-calc/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Collective-Calc — Wer schuldet wem was? Ohne Konto, ohne App, ohne eigenen Server." />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0D1226" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Vor dem ersten Malen anwenden, damit es beim Laden nicht kurz aufblitzt.
      try {
        var s = JSON.parse(localStorage.getItem('cc.v1.settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', s.theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Zählung (F27): GoatCounter, ohne Kekse und ohne Kennung. Gesendet werden
      Seitenaufrufe und vier benannte Zähler — nie Beträge, Namen oder
      Anlassinhalte. Was gezählt wird, steht offen im README.

      Der Anker der Adresse enthält bei diesem Werkzeug die ganze Abrechnung und
      darf deshalb unter keinen Umständen mitgesendet werden. `data-goatcounter-
      settings` schneidet ihn ab, bevor irgendetwas das Gerät verlässt.
    -->
    <script
      data-goatcounter="https://dennis-mit-2n.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
