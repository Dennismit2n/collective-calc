<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Collective-Calc · Wer schuldet wem was?</title>
    <meta
      name="description"
      content="Gruppenausgaben teilen — ohne Konto, ohne App, ohne Server. Collective-Calc rechnet aus, wer wem wie viel schuldet, und teilt das Ergebnis als Link."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0D1226" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Vor dem ersten Malen anwenden, damit es beim Laden nicht kurz aufblitzt.
      try {
        var s = JSON.parse(localStorage.getItem('cc.v1.settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', s.theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Zählung (F27): GoatCounter, ohne Kekse und ohne Kennung. Gesendet werden
      Seitenaufrufe und vier benannte Zähler — nie Beträge, Namen oder
      Anlassinhalte. Was gezählt wird, steht offen im README.

      Der Anker der Adresse enthält bei diesem Werkzeug die ganze Abrechnung und
      darf deshalb unter keinen Umständen mitgesendet werden. `data-goatcounter-
      settings` schneidet ihn ab, bevor irgendetwas das Gerät verlässt.
    -->
    <script
      data-goatcounter="https://dennis-mit-2n.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
