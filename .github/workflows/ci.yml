# Prüfen und ausliefern.
#
# Die Auslieferung hängt ausdrücklich an den Tests: Was die Geldlogik nicht
# besteht, geht nicht live. Das ist der ganze Sinn der Entscheidung aus F15 —
# eine Abrechnung, die falsch rechnet, wäre der einzige wirklich unverzeihliche
# Fehler dieses Werkzeugs.
name: Prüfen und ausliefern

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    name: Typen, Tests, Bau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Einheitentests
        run: npm test
      - name: Bauen
        run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  browser:
    name: Browser-Test und Barrierefreiheit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browser holen
        run: npx playwright install --with-deps chromium
      - name: Link-Rundweg prüfen
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  ausliefern:
    name: Auf GitHub Pages stellen
    # Erst wenn beides grün ist. Und nur vom Hauptzweig aus.
    needs: [pruefen, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
