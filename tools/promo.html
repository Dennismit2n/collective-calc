<!doctype html>
<!--
  Vorlage für die Vorschaubilder.

  Wird von tools/make-promo.mjs mit Playwright zu PNG gerendert. Bewusst als
  eingecheckte Vorlage statt als fertige Grafik: So lässt sich das Bild
  nachbauen, wenn sich Farbe, Name oder Untertitel ändern — und es benutzt
  dieselben Farbwerte wie die App.

  Zwei Formate:
    og   1200×630  — Vorschaukarte in Messengern und sozialen Netzen
    ig   1080×1080 — quadratisch für Instagram
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url('');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d1226; }

      .karte {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d1226;
        color: #e6e9f7;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        text-align: center;
        overflow: hidden;
      }
      .karte.og { width: 1200px; height: 630px; }
      .karte.ig { width: 1080px; height: 1080px; }

      /* Ein sehr dezenter Schein in der Kachelfarbe, damit die Fläche nicht tot wirkt. */
      .karte::before {
        content: '';
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(74, 222, 128, 0.13), transparent 65%);
        top: -280px;
      }

      .inhalt { position: relative; display: flex; flex-direction: column; align-items: center; }

      .marke { display: block; }
      .og .marke { width: 132px; height: 132px; margin-bottom: 44px; }
      .ig .marke { width: 176px; height: 176px; margin-bottom: 58px; }

      .name { font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
      .og .name { font-size: 86px; }
      .ig .name { font-size: 104px; }

      .frage { color: #4ade80; font-weight: 600; letter-spacing: -0.01em; }
      .og .frage { font-size: 42px; margin-top: 26px; }
      .ig .frage { font-size: 52px; margin-top: 34px; }

      .en { color: #a29ccb; font-weight: 400; }
      .og .en { font-size: 27px; margin-top: 10px; }
      .ig .en { font-size: 33px; margin-top: 14px; }

      .versprechen {
        color: #a29ccb;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .og .versprechen { font-size: 25px; margin-top: 46px; }
      .ig .versprechen { font-size: 31px; margin-top: 62px; }
      .versprechen b { color: #e6e9f7; font-weight: 600; }
      .punkt { color: #263056; }

      /* Derselbe Farbstreifen wie auf der Startseite, nur mit dem Grün vorn. */
      .streifen { position: absolute; display: flex; border-radius: 99px; overflow: hidden; }
      .og .streifen { bottom: 52px; width: 260px; height: 7px; }
      .ig .streifen { bottom: 84px; width: 300px; height: 8px; }
      .streifen span { height: 100%; }
      .s1 { background: #4ade80; flex: 3; }
      .s2 { background: #8fd3f4; flex: 2; }
      .s3 { background: #a29ccb; flex: 2; }
    </style>
  </head>
  <body>
    <div class="karte og" id="og">
      <div class="inhalt">
        <svg class="marke" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#4ade80" />
          <g stroke="#0d1226" stroke-width="4.6" stroke-linecap="round">
            <path d="M24 24 L24 3.6" />
            <path d="M24 24 L41.7 34.2" />
            <path d="M24 24 L6.3 34.2" />
          </g>
          <circle cx="24" cy="24" r="4.2" fill="#0d1226" />
        </svg>
        <div class="name">Collective-Calc</div>
        <div class="frage">Wer schuldet wem was?</div>
        <div class="en">Who owes whom?</div>
        <div class="versprechen">
          <span><b>Ohne Konto</b></span><span class="punkt">·</span>
          <span><b>ohne App</b></span><span class="punkt">·</span>
          <span><b>ohne Server</b></span>
        </div>
      </div>
      <div class="streifen"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
    </div>

    <div class="karte ig" id="ig">
      <div class="inhalt">
        <svg class="marke" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="#4ade80" />
          <g stroke="#0d1226" stroke-width="4.6" stroke-linecap="round">
            <path d="M24 24 L24 3.6" />
            <path d="M24 24 L41.7 34.2" />
            <path d="M24 24 L6.3 34.2" />
          </g>
          <circle cx="24" cy="24" r="4.2" fill="#0d1226" />
        </svg>
        <div class="name">Collective-Calc</div>
        <div class="frage">Wer schuldet wem was?</div>
        <div class="en">Who owes whom?</div>
        <div class="versprechen">
          <span><b>Ohne Konto</b></span><span class="punkt">·</span>
          <span><b>ohne App</b></span><span class="punkt">·</span>
          <span><b>ohne Server</b></span>
        </div>
      </div>
      <div class="streifen"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
    </div>
  </body>
</html>
